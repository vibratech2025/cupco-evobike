<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EVOBIKE · Sorteo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--v:#2FE26A;--bg:#05070A;--card:#0C1218;--line:#1C2731}
  body{background:var(--bg);color:#EAF0F5;font-family:"Arial Black",Arial,sans-serif;padding:20px;
       min-height:100vh;display:flex;flex-direction:column;align-items:center}
  .wrap{width:100%;max-width:620px}
  .eb{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--v);text-transform:uppercase}
  h1{font-size:26px;line-height:1.05;margin:6px 0 14px}
  h1 em{font-style:normal;color:var(--v)}
  textarea{width:100%;height:140px;background:#0A1017;border:1px solid var(--line);border-radius:12px;
           padding:12px;color:#fff;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;outline:none}
  textarea:focus{border-color:var(--v)}
  .btn{width:100%;border:0;border-radius:14px;padding:17px;font-size:16px;font-family:"Arial Black",Arial,sans-serif;
       font-weight:900;background:var(--v);color:#04120A;cursor:pointer;margin-top:12px}
  .btn.ghost{background:transparent;color:#EAF0F5;border:1px solid var(--line)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
  .p{font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#93A1AE}
  .num{font-size:20px;color:var(--v)}
  .ganador{font-size:64px;line-height:1;color:var(--v);text-align:center;margin:18px 0 6px;word-break:break-word}
  .sub{font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#C9D4DE;text-align:center;line-height:1.5}
  .centro{text-align:center}
  .oculto{display:none}
  .lista{max-height:210px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
         color:#93A1AE;line-height:1.7;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="eb">EVOBIKE · CUPCO FEST</div>
  <h1 id="tit">PANTALLA DE <em>SORTEO</em></h1>

  <div id="carga">
    <div class="card">
      <p class="p"><b style="color:#fff">1.</b> Abrí el chat de WhatsApp de EVOBIKE y usá
        <b style="color:#fff">Exportar chat → sin archivos</b>.<br>
        <b style="color:#fff">2.</b> Copiá todo el texto y pegálo acá abajo (o pegá los códigos, uno por línea).<br>
        <b style="color:#fff">3.</b> Tocá «CARGAR» y después «SORTEAR».</p>
      <textarea id="txt" placeholder="EVOBIKE · CupCo Fest
Nombre: Juan Pérez
Mi número para el sorteo: EVO-7K3
Sorteo: hoy 20:30

EVOBIKE · CupCo Fest
Nombre: María Gómez
Mi número para el sorteo: EVO-B92
Sorteo: hoy 20:30"></textarea>
      <button class="btn" onclick="cargarLista()">CARGAR LISTA</button>
      <button class="btn ghost" onclick="desdeLocal()">Usar los que se anotaron en ESTE teléfono</button>
    </div>
  </div>

  <div id="panel" class="oculto">
    <div class="card">
      <div class="eb">Participantes cargados</div>
      <div class="num" id="cont">0</div>
      <div class="lista" id="lista"></div>
      <button class="btn ghost" onclick="reiniciar()" style="margin-top:14px">CAMBIAR LISTA</button>
    </div>
    <button class="btn" id="btnSortear" onclick="sortear()" style="margin-top:16px;font-size:20px;padding:24px">SORTEAR</button>
  </div>

  <div id="resultado" class="oculto">
    <div class="card">
      <div class="eb centro">GANADOR</div>
      <div class="ganador" id="ganador">—</div>
      <div class="sub" id="quien"></div>
      <button class="btn" onclick="otra()">SORTEAR OTRA VEZ</button>
    </div>
  </div>
</div>

<script>
let lista = [];

function normalizar(txt){
  const out = [];
  // 1) formato del mensaje de WhatsApp
  const re = /EVO-([A-Z0-9]{3,6})\b/g;
  let m, vistos = new Set();
  while((m = re.exec(txt)) !== null){
    const c = "EVO-" + m[1].toUpperCase();
    if(!vistos.has(c)){ vistos.add(c); out.push({codigo:c}); }
  }
  if(out.length) return out;
  // 2) una por línea
  txt.split(/\n/).forEach(l=>{
    const s = l.trim();
    if(s && !vistos.has(s)){ vistos.add(s); out.push({codigo:s}); }
  });
  return out;
}

function pintar(){
  document.getElementById("carga").classList.add("oculto");
  document.getElementById("resultado").classList.add("oculto");
  document.getElementById("panel").classList.remove("oculto");
  document.getElementById("cont").textContent = lista.length;
  document.getElementById("lista").innerHTML = lista.map(p=>p.codigo + (p.nom? " · "+p.nom : "")).join("<br>");
  document.getElementById("btnSortear").disabled = lista.length === 0;
}

function cargarLista(){
  const txt = document.getElementById("txt").value;
  lista = normalizar(txt);
  if(!lista.length){ alert("No encontré ningún código. Pegá el texto del chat o los códigos, uno por línea."); return; }
  pintar();
}

function desdeLocal(){
  try{
    const s = JSON.parse(localStorage.getItem("evobike_cupco_v1")) || {};
    if(!s.codigo){ alert("En este teléfono no hay ningún registro."); return; }
    lista = [{codigo:s.codigo, nom:(s.nom||"")+" "+(s.ape||"")}];
    pintar();
  }catch(e){ alert("No se pudo leer."); }
}

function reiniciar(){
  document.getElementById("panel").classList.add("oculto");
  document.getElementById("resultado").classList.add("oculto");
  document.getElementById("carga").classList.remove("oculto");
}

let timer = null;

function sortear(){
  document.getElementById("panel").classList.add("oculto");
  document.getElementById("resultado").classList.remove("oculto");
  const g = document.getElementById("ganador"), q = document.getElementById("quien");
  let n = 0;
  clearInterval(timer);
  timer = setInterval(()=>{
    const p = lista[Math.floor(Math.random()*lista.length)];
    g.textContent = p.codigo;
    q.textContent = p.nom || "";
    n++;
    if(n > 26){
      clearInterval(timer);
      const fin = lista[Math.floor(Math.random()*lista.length)];
      g.textContent = fin.codigo;
      q.textContent = (fin.nom || "") + "  ·  de " + lista.length + " participantes";
    }
  }, 90);
}

function otra(){
  document.getElementById("resultado").classList.add("oculto");
  document.getElementById("panel").classList.remove("oculto");
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0420">
<title>EVOBIKE · SUBÍ DE NIVEL</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0a0420}
  body{font-family:"Arial Black",system-ui,-apple-system,sans-serif;color:#fff;user-select:none}
  #stage{position:fixed;inset:0;overflow:hidden}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------- HUD ---------- */
  #hud{position:absolute;top:0;left:0;right:0;padding:12px 16px 0;display:flex;align-items:center;
       justify-content:space-between;gap:10px;z-index:5}
  .logo{font-size:19px;letter-spacing:-.5px;text-shadow:0 0 18px rgba(47,226,106,.8)}
  .logo b{color:#2FE26A}
  .cont{font-family:ui-monospace,monospace;font-size:15px;color:#7ee8ff;letter-spacing:1px;
        background:rgba(126,232,255,.1);border:1px solid rgba(126,232,255,.28);padding:4px 11px;border-radius:20px}
  .cont span{opacity:.55;font-size:12px}
  #mute{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;
        width:36px;height:36px;border-radius:12px;font-size:15px;cursor:pointer;backdrop-filter:blur(6px)}

  /* ---------- GARAGE ---------- */
  #garage{position:absolute;top:56px;left:0;right:0;display:flex;justify-content:center;gap:6px;
          z-index:5;padding:0 10px}
  .slot{width:44px;height:38px;border-radius:10px;background:rgba(255,255,255,.05);
        border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;
        overflow:hidden;transition:.35s;position:relative}
  .slot img{width:40px;object-fit:contain;filter:grayscale(1) brightness(.45);opacity:.55;transition:.4s}
  .slot.on{border-color:rgba(47,226,106,.8);background:rgba(47,226,106,.13);
           box-shadow:0 0 16px rgba(47,226,106,.5)}
  .slot.on img{filter:none;opacity:1;transform:scale(1.06)}
  .slot.nueva{animation:slotpop .7s cubic-bezier(.2,.9,.2,1.6)}
  @keyframes slotpop{0%{transform:scale(.4) rotate(-14deg);filter:brightness(3)}
                     60%{transform:scale(1.22) rotate(4deg)}100%{transform:scale(1)}}

  /* ---------- BANNER NUEVA MOTO ---------- */
  #banner{position:absolute;top:34%;left:50%;transform:translate(-50%,-30px);z-index:8;
          padding:11px 20px;border-radius:16px;white-space:nowrap;opacity:0;pointer-events:none;
          background:linear-gradient(100deg,rgba(47,226,106,.96),rgba(126,232,255,.96));
          color:#04120a;font-size:14px;letter-spacing:.06em;
          box-shadow:0 12px 44px rgba(47,226,106,.55)}
  #banner.on{animation:banner 2.1s cubic-bezier(.2,.9,.2,1) forwards}
  @keyframes banner{0%{opacity:0;transform:translate(-50%,-30px) scale(.8)}
                    14%{opacity:1;transform:translate(-50%,0) scale(1.04)}
                    22%{transform:translate(-50%,0) scale(1)}
                    82%{opacity:1;transform:translate(-50%,0) scale(1)}
                    100%{opacity:0;transform:translate(-50%,-14px) scale(.96)}}

  .speedo{position:absolute;left:18px;top:112px;z-index:5;font-family:ui-monospace,Menlo,monospace}
  .speedo .n{font-size:32px;line-height:1;letter-spacing:-2px;color:#fff;text-shadow:0 0 20px rgba(0,229,255,.85)}
  .speedo .u{font-size:10px;letter-spacing:.22em;color:#7ee8ff;opacity:.85}

  /* ---------- PANEL ---------- */
  #ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;z-index:4;pointer-events:none}
  #panel{pointer-events:auto;padding:0 14px calc(16px + env(safe-area-inset-bottom));max-width:640px;width:100%;margin:0 auto}
  .card{background:rgba(8,4,24,.85);border:1px solid rgba(126,232,255,.26);border-radius:22px;padding:18px;
        -webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);
        box-shadow:0 0 0 1px rgba(47,226,106,.12),0 18px 60px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.07);
        animation:sube .34s cubic-bezier(.2,.9,.25,1.2) both}
  @keyframes sube{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .kicker{font-size:10.5px;letter-spacing:.26em;color:#7ee8ff;text-transform:uppercase;margin-bottom:7px}
  .kicker b{color:#2FE26A}
  h1{font-size:clamp(24px,7vw,38px);line-height:.98;letter-spacing:-1.4px;margin:2px 0 10px}
  h1 em{font-style:normal;background:linear-gradient(100deg,#2FE26A,#7ee8ff 55%,#ff5fbe);
        -webkit-background-clip:text;background-clip:text;color:transparent;
        filter:drop-shadow(0 0 14px rgba(47,226,106,.55))}
  p{font-family:system-ui,-apple-system,sans-serif;font-weight:500;font-size:15px;line-height:1.48;color:#cfd8e6}
  .q{font-size:clamp(16px,4.4vw,20px);line-height:1.26;letter-spacing:-.3px;margin:4px 0 2px}

  .ops{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .op{display:flex;align-items:center;gap:12px;width:100%;padding:14px 15px;border-radius:15px;
      background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);color:#fff;
      font-size:15.5px;text-align:left;font-family:system-ui,sans-serif;font-weight:600;cursor:pointer;
      transition:transform .12s,background .2s,border-color .2s}
  .op b{flex:0 0 26px;height:26px;border-radius:9px;background:rgba(126,232,255,.16);color:#7ee8ff;
        display:flex;align-items:center;justify-content:center;font-size:12.5px;font-family:"Arial Black",sans-serif}
  .op:active{transform:scale(.985)}
  .op.bien{background:linear-gradient(180deg,#5cff95,#2FE26A);border-color:#2FE26A;color:#04120a;
           animation:pop .4s cubic-bezier(.2,.9,.2,1.5)}
  .op.bien b{background:rgba(0,0,0,.18);color:#04120a}
  .op.mal{background:rgba(239,61,92,.18);border-color:rgba(239,61,92,.6);color:#ff9aab;
          text-decoration:line-through;animation:no .38s}
  .op.mal b{background:rgba(239,61,92,.3);color:#ff9aab}
  .op:disabled{opacity:.5;cursor:default}
  @keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes no{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  .btns{display:flex;gap:10px;margin-top:14px}
  button{font-family:"Arial Black",system-ui,sans-serif;font-weight:900;border:0;cursor:pointer;
         border-radius:16px;transition:transform .12s}
  button:active{transform:scale(.96)}
  .big{width:100%;padding:18px;font-size:16.5px;color:#04120a;
       background:linear-gradient(180deg,#5cff95,#2FE26A 60%,#12c452);
       box-shadow:0 7px 0 #0d7a35,0 0 40px rgba(47,226,106,.55)}
  .ghost{width:100%;padding:14px;font-size:13.5px;color:#cfd8e6;background:rgba(255,255,255,.07);
         border:1px solid rgba(255,255,255,.16)}

  .ayuda{margin-top:12px;font-family:system-ui,sans-serif;font-weight:500;font-size:13.5px;line-height:1.42;
         color:#ffe08a;background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.35);
         border-left:4px solid #FFD166;border-radius:12px;padding:11px 13px;animation:sube .3s both}
  .dato{margin-top:12px;font-family:system-ui,sans-serif;font-weight:500;font-size:13.5px;line-height:1.42;
        color:#a8ffc8;background:rgba(47,226,106,.1);border:1px solid rgba(47,226,106,.32);
        border-left:4px solid #2FE26A;border-radius:12px;padding:11px 13px}
  .pista{margin-top:11px;font-family:system-ui,-apple-system,sans-serif;font-weight:500;font-size:11.5px;
         line-height:1.45;color:#8fb0c4;background:rgba(126,232,255,.07);
         border-left:2px solid rgba(126,232,255,.55);border-radius:8px;padding:7px 10px}
  .mini{font-family:ui-monospace,monospace;font-size:12px;color:#7ee8ff;margin-top:8px;letter-spacing:.04em}

  label{display:block;font-size:10.5px;letter-spacing:.2em;color:#8fa3bb;margin:12px 0 6px;text-transform:uppercase}
  input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(126,232,255,.22);border-radius:14px;
        padding:15px 14px;font-family:system-ui,sans-serif;font-weight:600;font-size:16px;color:#fff;outline:none}
  input:focus{border-color:#2FE26A;box-shadow:0 0 0 3px rgba(47,226,106,.18)}
  .chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-family:system-ui,sans-serif;
       font-weight:500;font-size:12.5px;color:#93a3b8;line-height:1.4}
  .chk input{width:21px;height:21px;flex:0 0 21px;margin-top:1px;accent-color:#2FE26A}
  .err{font-family:system-ui,sans-serif;font-size:13px;color:#ff8a9b;margin-top:9px}

  #flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:6}
  #flash.ok{background:radial-gradient(circle at 50% 55%,rgba(47,226,106,.55),transparent 62%);animation:fl .45s}
  #flash.bad{background:radial-gradient(circle at 50% 55%,rgba(239,61,92,.5),transparent 62%);animation:fl .4s}
  @keyframes fl{0%{opacity:0}18%{opacity:1}100%{opacity:0}}

  #grito{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:7;
         pointer-events:none;opacity:0}
  #grito.on{opacity:1;animation:grito .85s cubic-bezier(.2,.9,.2,1) forwards}
  #grito span{font-size:clamp(34px,12vw,78px);letter-spacing:-2px;
              background:linear-gradient(180deg,#fff,#2FE26A);-webkit-background-clip:text;background-clip:text;
              color:transparent;text-shadow:0 0 60px rgba(47,226,106,.9)}
  @keyframes grito{0%{transform:scale(.4) rotate(-6deg);opacity:0}
                   22%{transform:scale(1.12) rotate(2deg);opacity:1}
                   70%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1.35);opacity:0}}

  .shake{animation:sh .38s}
  @keyframes sh{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,4px)}
                40%{transform:translate(6px,-5px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(3px,4px)}}

  .ticket{position:relative;overflow:hidden}
  .ticket:before{content:"";position:absolute;inset:-40% -10%;
                 background:conic-gradient(from 0deg,transparent,rgba(47,226,106,.16),transparent 40%);
                 animation:gira 5s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .cod{position:relative;font-size:clamp(32px,10.5vw,54px);letter-spacing:1px;text-align:center;
       background:linear-gradient(180deg,#fff,#7ee8ff);-webkit-background-clip:text;background-clip:text;
       color:transparent;filter:drop-shadow(0 0 22px rgba(126,232,255,.8));margin:5px 0 2px;
       font-family:ui-monospace,Menlo,monospace}
  .sub{position:relative;font-family:system-ui,sans-serif;font-weight:600;font-size:13.5px;color:#9fb0c6;text-align:center}
  a.big{display:block;text-align:center;text-decoration:none}

  /* ---------- PRESENTACION DE LA MOTO ---------- */
  #presenta{position:absolute;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;align-items:center;
            justify-content:center;gap:16px;padding:28px;opacity:0;pointer-events:none;
            background:radial-gradient(circle at 50% 45%,rgba(22,7,52,.97),rgba(4,1,12,.99));
            transition:opacity .3s}
  #presenta.on{opacity:1}
  .pr-k{font-family:system-ui,sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.24em;
        color:#7ee8ff;text-align:center}
  #pr-img{width:min(80vw,540px);height:auto;filter:drop-shadow(0 0 42px rgba(255,255,255,.8))}
  #presenta.on #pr-img{animation:prBici .85s cubic-bezier(.2,.9,.2,1.35) both}
  @keyframes prBici{0%{transform:translateY(46px) scale(.68);opacity:0}
                    60%{transform:translateY(-8px) scale(1.04);opacity:1}
                    100%{transform:none;opacity:1}}
  .pr-n{font-size:clamp(30px,9.5vw,56px);letter-spacing:-1.8px;line-height:1;
        background:linear-gradient(180deg,#fff,#2FE26A 70%);
        -webkit-background-clip:text;background-clip:text;color:transparent;
        filter:drop-shadow(0 0 24px rgba(47,226,106,.7))}
  .pr-s{font-family:system-ui,sans-serif;font-weight:600;font-size:13px;color:#9fb0c6;
        letter-spacing:.06em;text-align:center}

  /* ---------- LOGO BOOM ---------- */
  #boom{position:absolute;inset:0;z-index:9;pointer-events:none;display:flex;align-items:center;justify-content:center;
        pointer-events:none;opacity:0}
  #boom.on{animation:boomIn 1.25s cubic-bezier(.2,.9,.2,1) forwards}
  #boom .blogo{position:relative;width:min(76vw,540px);height:auto;
               filter:drop-shadow(0 0 46px rgba(47,226,106,.95)) drop-shadow(0 0 90px rgba(126,232,255,.5))}
  #boom .burst{position:absolute;width:70vmax;height:70vmax;border-radius:50%;
               background:radial-gradient(circle,rgba(47,226,106,.6),rgba(47,226,106,0) 62%)}
  #boom.on .burst{animation:burst 1.1s ease-out forwards}
  @keyframes boomIn{0%{opacity:0;transform:scale(.3) rotate(-7deg)}
                    16%{opacity:1;transform:scale(1.2) rotate(2deg)}
                    28%{transform:scale(1) rotate(0)}
                    72%{opacity:1;transform:scale(1.05)}
                    100%{opacity:0;transform:scale(1.55)}}
  @keyframes burst{0%{transform:scale(.15);opacity:1}100%{transform:scale(1.7);opacity:0}}
  .in-evento{display:flex;align-items:center;gap:10px;animation:sube .7s .8s both;opacity:.95}
  .in-evento img{height:38px;width:auto}
  .in-evento span{font-family:system-ui,sans-serif;font-weight:800;font-size:11px;letter-spacing:.22em;
                  color:#b9c8d8;border:1px solid rgba(185,200,216,.35);border-radius:20px;padding:5px 12px}

  /* ---------- INTRO ---------- */
  #intro{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:15px;padding:34px 24px;text-align:center;
         background:radial-gradient(circle at 50% 38%,#1e0838 0%,#0a0420 55%,#05010f 100%);
         transition:opacity .5s}
  #intro.off{opacity:0;pointer-events:none}
  .paso{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:16px;padding:34px 24px 90px;opacity:0;transform:scale(.96);transition:opacity .45s,transform .45s;
        pointer-events:none}
  .paso.on{opacity:1;transform:scale(1);pointer-events:auto}
  .in-title{font-size:clamp(34px,11vw,62px);letter-spacing:-2px;
            background:linear-gradient(100deg,#fff,#2FE26A 60%,#7ee8ff);
            -webkit-background-clip:text;background-clip:text;color:transparent;
            filter:drop-shadow(0 0 26px rgba(47,226,106,.75))}
  .in-hint{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.26em;color:#7ee8ff;
           opacity:.85;animation:latido 1.8s infinite}
  .in-pre{font-family:system-ui,sans-serif;font-weight:800;font-size:clamp(13px,4vw,18px);
          letter-spacing:.24em;color:#cfe3f5}
  .in-after{opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s;text-align:center;
            font-size:clamp(19px,5.6vw,30px);line-height:1.08;letter-spacing:-.6px;color:#fff;
            text-shadow:0 0 26px rgba(255,212,0,.5)}
  .in-after.on{opacity:1;transform:none}
  .in-after em{font-style:normal;background:linear-gradient(180deg,#fff,#FFD400 75%);
               -webkit-background-clip:text;background-clip:text;color:transparent}
  .in-sol{font-size:clamp(44px,14vw,86px);letter-spacing:-2px;line-height:.95;
          background:linear-gradient(180deg,#fff,#FFD400 55%,#ff8a00);
          -webkit-background-clip:text;background-clip:text;color:transparent;
          filter:drop-shadow(0 0 40px rgba(255,196,0,.8))}
  #biciVuela{position:absolute;width:min(80vw,480px);height:auto;top:50%;left:0;
             transform:translate(-130%,-50%);opacity:0;
             filter:drop-shadow(0 0 22px rgba(255,255,255,.9))}
  #biciVuela.vuela{animation:volar 2.6s cubic-bezier(.3,.1,.5,1) forwards}
  @keyframes volar{
    0%{transform:translate(-130%,-50%) rotate(-14deg) scale(.65);opacity:0}
    12%{opacity:1}
    55%{transform:translate(22%,-64%) rotate(6deg) scale(1)}
    88%{opacity:1}
    100%{transform:translate(150%,-46%) rotate(-4deg) scale(.8);opacity:0}
  }
  .in-log{animation:intrologo 1.05s cubic-bezier(.2,.9,.2,1.3) both}
  .in-log img{width:min(70vw,330px);height:auto;filter:drop-shadow(0 0 36px rgba(47,226,106,.9))}
  @keyframes intrologo{0%{transform:scale(.55);opacity:0;filter:blur(6px)}
                       55%{transform:scale(1.07);opacity:1;filter:blur(0)}
                       100%{transform:scale(1)}}
  .in-t1{font-size:clamp(27px,8.4vw,46px);line-height:.96;letter-spacing:-1.6px;
         animation:sube .7s .5s both}
  .in-t1 em{font-style:normal;background:linear-gradient(100deg,#2FE26A,#7ee8ff 55%,#ff5fbe);
            -webkit-background-clip:text;background-clip:text;color:transparent;
            filter:drop-shadow(0 0 16px rgba(47,226,106,.6))}
  .in-t2{font-family:system-ui,sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.2em;
         color:#7ee8ff;text-transform:uppercase;animation:sube .7s .7s both}
  .in-chip{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.28em;color:#7ee8ff;
           border:1px solid rgba(126,232,255,.45);border-radius:20px;padding:5px 14px;
           background:rgba(126,232,255,.08);animation:sube .7s .35s both}
  .in-suerte{font-family:"Arial Black",sans-serif;font-size:clamp(17px,5vw,24px);letter-spacing:-.5px;
             color:#2FE26A;text-shadow:0 0 30px rgba(47,226,106,.85);transform:rotate(-2.5deg);
             animation:sube .7s 1s both, latido 2.2s 1.7s infinite}
  .in-promesa{font-size:clamp(16px,4.6vw,22px);line-height:1.15;letter-spacing:-.4px;color:#fff;
              text-shadow:0 0 26px rgba(47,226,106,.55);animation:sube .7s .85s both}
  .in-t3{font-family:system-ui,sans-serif;font-weight:500;font-size:15px;line-height:1.5;
         color:#c8d4e2;max-width:430px;animation:sube .7s .9s both}
  .in-btn{margin-top:8px;padding:18px 36px;font-size:17px;color:#04120a;border-radius:18px;
          background:linear-gradient(180deg,#5cff95,#2FE26A 60%,#12c452);
          box-shadow:0 8px 0 #0d7a35,0 0 50px rgba(47,226,106,.6);
          animation:sube .7s 1.05s both, latido 2s 1.8s infinite}
  @keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  .in-pie{font-family:system-ui,sans-serif;font-size:9.5px;letter-spacing:.26em;color:#4a5a6a;
          animation:sube .7s 1.2s both}

  @media (min-width:820px){
    #panel{max-width:720px;padding-bottom:30px}
    .card{padding:26px 28px;border-radius:26px}
    p{font-size:17.5px} .q{font-size:24px} .op{font-size:18px;padding:16px 18px}
    .big{font-size:20px;padding:22px}
    .speedo .n{font-size:48px} h1{font-size:44px}
    .slot{width:60px;height:48px} .slot img{width:54px}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="logo" onclick="verIntro()" style="cursor:pointer">EVO<b>BIKE</b></div>
    <div class="cont" id="cont">1<span>/7</span></div>
    <button id="mute" title="sonido">🔊</button>
  </div>

  <div id="garage"></div>
  <div id="banner">NUEVA MOTO</div>
  <div class="speedo"><div class="n" id="kmh">0</div><div class="u">KM/H</div></div>

  <div id="ui"><div id="panel"></div></div>
  <div id="flash"></div>
  <div id="grito"><span>¡BOOST!</span></div>
  <div id="boom"><div class="burst"></div><img class="blogo" src="img/logo.png" alt="EVOBIKE"></div>

  <div id="presenta">
    <div class="pr-k">AHORA VAS A MANEJAR UNA</div>
    <img id="pr-img" src="motos/vmp_s5.png" alt="">
    <div class="pr-n" id="pr-n">—</div>
    <div class="pr-s" id="pr-s"></div>
  </div>

  <div id="intro">
    <div class="paso on" id="p1">
      <div class="in-log"><img src="img/logo.png" alt="EVOBIKE"></div>
    </div>
    <div class="paso" id="p2">
      <img id="biciVuela" src="motos/sol_pro.png" alt="">
      <div class="in-after" id="p2txt">ESA MOTO QUE PASÓ<br><em>PUEDE SER HOY TUYA</em></div>
    </div>
    <div class="paso" id="p3">
      <div class="in-promesa">GANÁ EL JUEGO Y<br>ASEGURA TU LUGAR</div>
      <div class="in-suerte">¡MUCHA SUERTE!</div>
      <button class="in-btn" onclick="empezarJuego()">EMPEZAR NIVEL 1</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   CONFIG

   Tono mayor, saltona, con bajo caminador. Dos voces de onda cuadrada. */
const MEL_A = [67,71,74,79,76,74,71,67,  72,76,79,84,83,79,76,72,
               74,78,81,86,84,81,78,74,  79,83,86,83,79,76,74,71];
const MEL_B = [79,79,79,76,74,74,72,71,  72,72,72,76,79,79,76,72,
               74,74,74,78,81,81,78,74,  79,76,74,71,67,0,0,0];
const BAJOS = [43,43,43,43,43,43,43,43,  48,48,48,48,48,48,48,48,
               50,50,50,50,50,50,50,50,  43,43,43,43,43,43,43,43];
const PULSO = 0.105;
const fnota = m => 440*Math.pow(2,(m-69)/12);

function notaChiptune(midi, t0, dur, vol){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type="square"; o.frequency.value=fnota(midi);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.010);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur*0.85);
  o.connect(g); g.connect(musGain);
  o.start(t0); o.stop(t0+dur);
}
function programarMusica(){
  if(!AC || !musiOn) return;
  const ahora = AC.currentTime;
  while(musNext < ahora + 0.30){
    const i = musIdx % 64;
    const mel = (i<32 ? MEL_A[i] : MEL_B[i-32]);
    const bajo = BAJOS[i];
    if(mel > 0){
      notaChiptune(mel,    musNext, PULSO*0.88, 0.055);   // melodia
      notaChiptune(mel-12, musNext, PULSO*0.88, 0.020);   // refuerzo una octava abajo
    }
    if(bajo > 0) notaChiptune(bajo, musNext, PULSO*0.60, 0.048);  // bajo caminador
    musNext += PULSO;
    musIdx++;
  }
}
function musicaOn(){
  if(!AC || musiOn) return;
  musiOn = true; musIdx = 0; musNext = AC.currentTime + 0.15;
  if(musTimer) clearInterval(musTimer);
  musTimer = setInterval(programarMusica, 140);
}
function musicaOff(){
  musiOn = false;

}
function aplicarMute(){

}

function sonidoWhoosh(){                     // para la moto que pasa volando
  if(!AC||silencio) return;
  const n=AC.sampleRate*0.5, buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);

  src.buffer=buf; f.type="bandpass"; f.frequency.setValueAtTime(300,t0);
  f.frequency.exponentialRampToValueAtTime(2600,t0+.45); f.Q.value=1.4;
  g.gain.setValueAtTime(.18,t0); g.gain.exponentialRampToValueAtTime(.0005,t0+.5);

function sonidoAplausos(){
  if(!AC||silencio) return;
  const dur=2.2, sr=AC.sampleRate, n=Math.floor(sr*dur);
  const buf=AC.createBuffer(1,n,sr), d=buf.getChannelData(0);
  const env=new Float32Array(n);
  for(let k=0;k<95;k++){
    const t0=Math.pow(Math.random(),0.75)*dur*0.9;
    const s0=Math.floor(t0*sr), largo=Math.floor(0.055*sr);
    for(let i=0;i<largo && s0+i<n;i++){
      const v=Math.exp(-(i/sr)*75);
      if(v>env[s0+i]) env[s0+i]=v;
    }
  }
  for(let i=0;i<n;i++){
    const t=i/sr;
    const fade=Math.min(1,t/0.12)*Math.min(1,(dur-t)/0.45);
    d[i]=(Math.random()*2-1)*env[i]*0.55*fade;
  }
  const src=AC.createBufferSource(), g=AC.createGain(), f=AC.createBiquadFilter();
  src.buffer=buf; f.type="bandpass"; f.frequency.value=2300; f.Q.value=0.6; g.gain.value=1.0;
  src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
}

function dibujarFantasma(x,y,r,col,dir){
  ctx.save(); ctx.translate(x,y); if(dir===-1) ctx.scale(-1,1);
  ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=16;
  ctx.beginPath();
  ctx.arc(0,-r*0.08,r,Math.PI,0);
  ctx.lineTo(r,r*0.62);
  const n=4;
  for(let i=0;i<n;i++){
    const x2 = r-(i+1)*(2*r/n);
    ctx.quadraticCurveTo(x2+(r/n), r*1.02, x2, r*0.62);
  }
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0; ctx.fillStyle="#fff";
  ctx.beginPath(); ctx.arc(-r*0.34,-r*0.18,r*0.27,0,7); ctx.arc(r*0.34,-r*0.18,r*0.27,0,7); ctx.fill();
  ctx.fillStyle="#1a1aff";
  ctx.beginPath(); ctx.arc(-r*0.18,-r*0.18,r*0.14,0,7); ctx.arc(r*0.50,-r*0.18,r*0.14,0,7); ctx.fill();
  ctx.restore();
}
function actualizarPac(){
  if(PAC.activo>0){
    PAC.activo--; PAC.x+=0.011;
    if(PAC.invertido>0) PAC.invertido--;
    if(PAC.x>1.45) PAC.activo=0;
  }else{
    PAC.prox--;
    if(PAC.prox<=0){ PAC.activo=330; PAC.x=-0.35; PAC.prox=500+Math.random()*400; }
  }
}
function dibujarPac(hor,Z){
  if(PAC.activo<=0) return;
  const r=Math.max(11,Math.min(26,W*0.026));
  const y=hor-Z*0.11;
  const base=PAC.x*W;
  ctx.save(); ctx.globalAlpha=.96;
  if(PAC.invertido>0){
    // GANASTE: los fantasmas huyen adelante y pacman los persigue
    for(let i=0;i<4;i++) dibujarFantasma(base+185+i*44, y, r*0.95, "#3B6BFF", 1);
    dibujarPacman(base+55, y, r*1.08, 1);
  }else{
    // normal: pacman adelante, los fantasmas atras
    dibujarPacman(base+250, y, r*1.05, 1);
    for(let i=0;i<4;i++) dibujarFantasma(base+i*44, y, r*0.95, FANT_COL[i], 1);
  }
  ctx.restore();
}

function pintar(){
  t+=1/60;
  if(CORTE.activo>0){ dibujarCorte(); requestAnimationFrame(pintar); return; }
  const hor=horizonte(), Z=zona();

  // cielo (degradado cacheado: no se recrea por cuadro)
  gradientes(hor);
  ctx.fillStyle=_gSky; ctx.fillRect(0,0,W,hor);

  // estrellas
  estrellas.forEach(e=>{
    ctx.globalAlpha=e.a*(.55+.45*Math.sin(t*2+e.x*20));
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(e.x*W,e.y*hor,e.r,0,7); ctx.fill();
  });
  ctx.globalAlpha=1;

  // sol
  const cx=W*0.74, cy=hor-Z*0.30, rad=Z*0.175;
  const sg=ctx.createLinearGradient(0,cy-rad,0,cy+rad);
  sg.addColorStop(0,"#ffe27a"); sg.addColorStop(.5,"#ff9a3d"); sg.addColorStop(1,"#ff2d78");
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,rad,0,7); ctx.clip();
  ctx.fillStyle=sg; ctx.fillRect(cx-rad,cy-rad,rad*2,rad*2);
  ctx.fillStyle="#3b0a54";
  for(let i=0;i<7;i++) ctx.fillRect(cx-rad, cy+rad*0.05+i*(rad*0.16), rad*2, rad*0.055+i*0.9);
  ctx.restore();
  ctx.save(); ctx.shadowColor="rgba(255,90,140,.85)"; ctx.shadowBlur=50;
  ctx.beginPath(); ctx.arc(cx,cy,rad,0,7); ctx.strokeStyle="rgba(255,120,160,.35)"; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();

  // ciudad
  const vel=0.35+velActual/240;
  CAPAS.forEach((capa,ci)=>{
    const off=((scrollX*capa.vel*vel*3.2)%1)*capa.total;
    capa.ed.forEach(e=>{
      const w=e.w*W, h=e.h*Z;
      let x=((e.pos-off)*W)%(capa.total*W);
      if(x<0) x+=capa.total*W;
      if(x>W) return;
      ctx.fillStyle=capa.col; ctx.fillRect(x,hor-h,w+1,h);
      ctx.fillStyle= ci?"rgba(126,232,255,.26)":"rgba(255,95,190,.20)";
      for(let vy=hor-h+8; vy<hor-10; vy+=15)
        for(let vx=x+5; vx<x+w-5; vx+=11)
          if((((vx*7+vy*3)|0)%23)<3) ctx.fillRect(vx,vy,2.5,4.5);
    });
  });

  // suelo
  ctx.fillStyle=_gSuelo; ctx.fillRect(0,hor,W,H-hor);

  // rejilla
  ctx.save(); ctx.beginPath(); ctx.rect(0,hor,W,H-hor); ctx.clip();
  ctx.strokeStyle="rgba(47,226,106,.30)"; ctx.lineWidth=1.4;
  const fuga=W*0.5, prof=26;
  for(let i=-prof;i<=prof;i++){
    ctx.beginPath();
    ctx.moveTo(fuga+i*(W*0.030), hor);
    ctx.lineTo(fuga+i*(W*0.34), H);
    ctx.stroke();
  }
  const paso=(scrollX*0.9)%1;
  for(let k=0;k<14;k++){
    const p=(k+paso)/14, y=hor+Math.pow(p,2.6)*(H-hor)*1.5;
    if(y>H) continue;
    ctx.globalAlpha=Math.min(1,p*2.4);
    ctx.strokeStyle="rgba(126,232,255,.30)";
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  ctx.globalAlpha=1; ctx.restore();

  // horizonte neón
  ctx.save(); ctx.strokeStyle="rgba(126,232,255,.85)"; ctx.lineWidth=2;
  ctx.shadowColor="#7ee8ff"; ctx.shadowBlur=18;
  ctx.beginPath(); ctx.moveTo(0,hor); ctx.lineTo(W,hor); ctx.stroke(); ctx.restore();

  actualizarPac();
  dibujarPac(hor,Z);

  // líneas de velocidad
  if(velActual>25){
    const n=Math.min(26,velActual/6);
    ctx.strokeStyle="rgba(255,255,255,"+Math.min(.5,velActual/260)+")"; ctx.lineWidth=2;
    for(let i=0;i<n;i++){
      const y=hor+((i*97+t*velActual*12)%(H-hor));
      const x=W-((t*velActual*26+i*160)%(W*1.6));
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+70+velActual,y); ctx.stroke();
    }
  }

  dibujarMoto(hor,Z);
  if(gateT>0) dibujarGate(hor,Z);

  partes=partes.filter(p=>p.vida>0);
  partes.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vida--;
    ctx.globalAlpha=Math.max(0,p.vida/p.max); ctx.fillStyle=p.col;
    ctx.fillRect(p.x,p.y,p.s,p.s); });
  ctx.globalAlpha=1;

  confeti=confeti.filter(c=>c.y<H+40);
  confeti.forEach(c=>{ c.x+=c.vx; c.y+=c.vy; c.vy+=0.16; c.rot+=c.vr;
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot);
    ctx.fillStyle=c.col; ctx.fillRect(-c.s/2,-c.s/4,c.s,c.s/2); ctx.restore(); });

  velActual+=(velObjetivo-velActual)*0.06;
  document.getElementById("kmh").textContent=Math.round(velActual);
  scrollX+=(0.4+velActual/165)*0.012;
  if(swap && swap.t>0) swap.t--;

  // si el equipo va lento, se apaga lo caro solo
  _fr++;
  if(_tf===0) _tf=performance.now();
  else if(performance.now()-_tf>1600){
    fps = _fr*1000/(performance.now()-_tf);
    CALIDAD = fps<32 ? 0 : 1;
    _fr=0; _tf=performance.now();
  }
  requestAnimationFrame(pintar);
}

function medirBici(id,Z,hor){
  const im=IMGS[id];
  if(!im||!im.complete||!im.width) return null;
  const anchoMax=W*0.74;
  const alto=Math.min((Z-hor)*1.55, anchoMax*(im.height/im.width));
  const ancho=im.width*(alto/im.height);
  const cy=Math.min(hor+(Z-hor)*0.55, Z-alto*0.5-10);
  return {im, alto, ancho, cy, cx:W*0.47};
}

function dibujarMoto(hor,Z){
  const bob=Math.sin(t*7)*2.2+(boostT>0?Math.sin(t*40)*3:0);
  const incl=boostT>0?-0.05:Math.sin(t*2.2)*0.012;

  // transición entre motos
  let a=medirBici(biciId,Z,hor);
  if(!a){                       // si la moto nueva todavía no cargó, seguimos con una que sí
    const libres=S().bikes||["vmp_s5"];
    for(let i=libres.length-1;i>=0;i--){ a=medirBici(libres[i],Z,hor); if(a) break; }
  }
  if(!a) return;
  let salida=null, prog=0;
  if(swap){
    prog=1-swap.t/45;
    salida=medirBici(swap.from,Z,hor);
  }
  const ease=x=>1-Math.pow(1-x,3);

  // moto que se va
  if(salida && swap.t>0){
    const p=ease(prog);
    ctx.save(); ctx.globalAlpha=1-p;
    ctx.translate(salida.cx - p*W*0.55, salida.cy+bob); ctx.rotate(incl-p*0.25);
    ctx.drawImage(salida.im, -salida.ancho/2, -salida.alto/2, salida.ancho, salida.alto);
    ctx.restore();
  }
  // moto que llega
  const entrada = swap ? ease(prog) : 1;
  const dx = swap ? (1-entrada)*W*0.55 : 0;
  const yy = a.cy+bob - (swap? (1-entrada)*26 : 0);

  ctx.save(); ctx.globalAlpha=.4; ctx.fillStyle="#000";
  ctx.beginPath(); ctx.ellipse(a.cx-dx, a.cy+a.alto*0.47, a.ancho*0.42, a.alto*0.055, 0,0,7); ctx.fill();
  ctx.restore();

  // AURA BLANCA (sprite cacheado, no degradado por cuadro)
  if(!_aura) _aura = spriteAura();
  const auraR = a.ancho*0.80;
  ctx.save(); ctx.globalAlpha = CALIDAD? 1 : .7;
  ctx.drawImage(_aura, a.cx-dx-auraR*1.22, a.cy-auraR*0.92, auraR*2.44, auraR*1.84);
  ctx.restore();

  ctx.save();
  ctx.translate(a.cx-dx, yy); ctx.rotate(incl);
  if(CALIDAD){
    ctx.shadowColor = boostT>0 ? "rgba(47,226,106,.95)" : "rgba(255,255,255,.9)";
    ctx.shadowBlur  = boostT>0 ? 40 : 16;
  }
  ctx.drawImage(a.im, -a.ancho/2, -a.alto/2, a.ancho, a.alto);
  ctx.restore();

  if(Math.random()<(boostT>0?0.9:0.16)){
    partes.push({x:a.cx-a.ancho*0.42-dx, y:a.cy+a.alto*0.40,
      vx:-2-Math.random()*3, vy:-Math.random()*1.6, g:.06, vida:20, max:20,
      s:2+Math.random()*2, col: boostT>0?"#2FE26A":"#7ee8ff"});
  }
  if(boostT>0) boostT--;
}

function dibujarGate(hor,Z){
  const p=1-Math.min(1,gateT/70);
  const alto=(Z-hor)*1.7, ancho=alto*0.44, y=hor+(Z-hor)*0.52;
  const x=W*0.47+(W*0.5)*(1-p);
  ctx.save(); ctx.globalAlpha=.25+.55*p;
  ctx.strokeStyle="#2FE26A"; ctx.lineWidth=4; ctx.shadowColor="#2FE26A"; ctx.shadowBlur=34;
  ctx.strokeRect(x-ancho/2,y-alto/2,ancho,alto);
  ctx.globalAlpha=.12+.2*p; ctx.fillStyle="#2FE26A";
  ctx.fillRect(x-ancho/2,y-alto/2,ancho,alto);
  ctx.restore(); gateT--;
}

function preguntar(n, qi){
  const nv=NIVELES[n], pr=nv.preg[qi], s=S();
  const st=(s.resp||{})[n+"_"+qi]||{mal:[]};
  velObjetivo=22;
  const letras=["A","B","C","D"];
  ui(`<div class="card">
      <div class="kicker">Nivel ${n} · ${nv.nombre} · pregunta ${qi+1} de 2</div>
      <div class="q">${esc(pr.q)}</div>

        ${pr.ops.map((o,i)=>`<button class="op ${st.mal.includes(i)?'mal':''}" ${st.mal.includes(i)?'disabled':''}
            data-i="${i}" onclick="responder(${n},${qi},${i})"><b>${letras[i]}</b><span>${esc(o)}</span></button>`).join("")}
      </div>
      <div class="pista">💡 ${esc(pr.ayuda)}</div>
    </div>`);
}

function responder(n, qi, elegido){
  const pr=NIVELES[n].preg[qi];
  const s=S(); s.resp=s.resp||{};
  const st=s.resp[n+"_"+qi]||{mal:[]};

  if(elegido===pr.ok){
    // marcar botón correcto antes de avanzar
    const btn=document.querySelector('.op[data-i="'+elegido+'"]');
    if(btn){ btn.classList.add("bien"); btn.disabled=true; }
    return setTimeout(()=>acierto(n,qi), 260);
  }

  st.mal.push(elegido); st.pista=true;
  s.resp[n+"_"+qi]=st; save(s);
  buzz(); destello("bad"); temblar();
  if(navigator.vibrate) navigator.vibrate([40,50,40]);

  const btn=document.querySelector('.op[data-i="'+elegido+'"]');
  if(btn){ btn.classList.add("mal"); btn.disabled=true; }

  // si ya tachó 3, queda una sola: se la revelamos y pasa
  if(st.mal.length>=3){
    const correcto=document.querySelector('.op[data-i="'+pr.ok+'"]');
    if(correcto) correcto.classList.add("bien");
    corte("mal", ()=>acierto(n,qi,true));
    return;
  }
  // pantalla de corte: los fantasmas lo persiguen a el, y vuelve la pregunta con la ayuda
  corte("mal", ()=>preguntar(n,qi));
}

function acierto(n,qi,conAyuda){
  const pr=NIVELES[n].preg[qi];
  const s=S(); s.bikes=s.bikes||["vmp_s5"];
  s.resp=s.resp||{}; s.resp[n+"_"+qi]=Object.assign(s.resp[n+"_"+qi]||{mal:[]},{ok:true,conAyuda:!!conAyuda});

  // desbloquear la siguiente moto
  let nueva=null;
  if(s.bikes.length<BIKES.length){
    const nx=BIKES[s.bikes.length];
    s.bikes.push(nx.id); nueva=nx; s.ultima=nx.id;
  }
  // nivel terminado cuando resolvió las 2 preguntas
  const hechas=Object.keys(s.resp).filter(k=>k.startsWith(n+"_")&&s.resp[k].ok).length;
  if(qi===NIVELES[n].preg.length-1 && !s["n"+n]) s["n"+n]=Date.now();
  save(s);

  destello("ok"); temblar(); boostT=64; velObjetivo=140; gateT=0;
  sonidoVida();
  PAC.activo=340; PAC.x=-0.35; PAC.invertido=340;   // ahora el pacman los persigue a ellos

  setTimeout(()=>{ beep([880,1320],.16,"triangle",.10); }, 340);
  ruido(.4,.09);
  if(navigator.vibrate) navigator.vibrate([25,35,25,35,60]);

  if(nueva){
    // cambio de moto con transición
    swap={from:s.bikes[s.bikes.length-2], to:nueva.id, t:45};
    biciId=nueva.id;
    garage(nueva.id);
  }

  for(let i=0;i<34;i++){
    partes.push({x:W*0.47, y:horizonte()+(zona()-horizonte())*0.52,
      vx:(Math.random()-.5)*11, vy:(Math.random()-.9)*8, g:.22, vida:48, max:48,
      s:2+Math.random()*3, col: Math.random()<.5?"#2FE26A":"#7ee8ff"});
  }

  // corte (pacman los persigue) -> presentacion de la moto -> siguiente pregunta
  const avanzar = ()=>{
    velObjetivo=26;
    const ultima = qi===NIVELES[n].preg.length-1;
    if(!ultima) return preguntar(n, qi+1);
    if(n<3) return entrarNivel(n+1);
    return pantallaRegistro();
  };
  corte("bien", ()=>{ if(nueva) presentar(nueva, avanzar); else avanzar(); });
}

function telWa(d){
  const n=(d||"").replace(/\D/g,"");
  if(!n) return "";
  if(n.startsWith("54")) return n;
  return "549"+n;                      // celular argentino
}
function normalizaWa(v){
  let d=(v||"").replace(/\D/g,"");
  if(d.startsWith("54")) d=d.slice(2);
  if(d.startsWith("9")) d=d.slice(1);
  if(d.startsWith("0")) d=d.slice(1);
  return d;
}
function enviarRegistro(){

/* ---------- PDF del codigo (generado a mano, sin librerias) ---------- */
/* ancho real de cada caracter en Helvetica / Helvetica-Bold (unidades de 1000) */
const _ANCHOS = {
  normal:{A:667,B:667,C:722,D:722,E:667,F:611,G:778,H:722,I:278,J:500,K:667,L:556,M:833,N:722,
          O:778,P:667,Q:778,R:722,S:667,T:611,U:722,V:667,W:944,X:667,Y:667,Z:611,
          "0":556,"1":556,"2":556,"3":556,"4":556,"5":556,"6":556,"7":556,"8":556,"9":556,
          "-":333,".":278,",":278," ":278,":":278,"(":333,")":333,"/":278,"&":667},
  bold:{  A:722,B:722,C:722,D:722,E:667,F:611,G:778,H:722,I:278,J:556,K:722,L:611,M:833,N:722,
          O:778,P:667,Q:778,R:722,S:667,T:611,U:722,V:667,W:944,X:667,Y:667,Z:611,
          "0":556,"1":556,"2":556,"3":556,"4":556,"5":556,"6":556,"7":556,"8":556,"9":556,
          "-":333,".":278,",":278," ":278,":":278,"(":333,")":333,"/":278,"&":722}
};
function anchoTexto(fuente, size, t){
  const tab=_ANCHOS[fuente==="F2"?"bold":"normal"];
  let a=0;
  for(const c of String(t)) a += (tab[c] !== undefined ? tab[c] : 556);
  return a*size/1000;
}

function _pdfEscape(t){
  return String(t).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)")
                  .replace(/[áàä]/g,"a").replace(/[éèë]/g,"e").replace(/[íìï]/g,"i")
                  .replace(/[óòö]/g,"o").replace(/[úùü]/g,"u").replace(/ñ/g,"n")
                  .replace(/[ÁÀÄ]/g,"A").replace(/[ÉÈË]/g,"E").replace(/[ÍÌÏ]/g,"I")
                  .replace(/[ÓÒÖ]/g,"O").replace(/[ÚÙÜ]/g,"U").replace(/Ñ/g,"N")
                  .replace(/[^\x20-\x7E]/g,"");
}
function generarPDF(s){
  const W=595, H=842;
  const nombre=(((s.nom||"")+" "+(s.ape||"")).trim()||"PARTICIPANTE").toUpperCase();
  const cod=(s.codigo||"");
  const L=[];
  // fondo
  L.push("0.02 0.03 0.04 rg 0 0 "+W+" "+H+" re f");
  // marco
  L.push("0.18 0.88 0.42 RG 4 w 26 26 "+ (W-52) +" "+ (H-52) +" re S");
  function txt(fuente, size, r,g,b, x, y, t){
    L.push("BT /"+fuente+" "+size+" Tf "+r+" "+g+" "+b+" rg 1 0 0 1 "+x+" "+y+" Tm ("+_pdfEscape(t)+") Tj ET");
  }
  function centrada(fuente,size,r,g,b,y,t){
    const ancho = anchoTexto(fuente, size, t);
    txt(fuente,size,r,g,b,(W-ancho)/2,y,t);
  }
  centrada("F2", 15, 0.18,0.88,0.42, 760, "EVOBIKE  ·  CUPCO FEST 2026");
  centrada("F2", 21, 1,1,1,               690, "MI NUMERO PARA EL SORTEO");
  centrada("F2", 58, 1,0.83,0,            580, cod);
  centrada("F2", 24, 1,1,1,               510, nombre);
  centrada("F1", 13, 0.62,0.69,0.78,      455, "Sorteo de una EVOBIKE SOL PRO");
  centrada("F1", 13, 0.62,0.69,0.78,      432, "CupCo Fest · La Unidad · hoy 20:30");
  centrada("F2", 15, 0.18,0.88,0.42,      360, "PRESENTA ESTE CODIGO EN LA CARPA");
  centrada("F1", 11, 0.42,0.49,0.56,      335, "Personal e intransferible");
  centrada("F1", 10, 0.42,0.49,0.56,      70,  "EVOBIKE ARGENTINA");
  const stream=L.join("\n");
  const objs=[
    "<< /Type /Catalog /Pages 2 0 R >>",
    "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+W+" "+H+"] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>",
    "<< /Length "+stream.length+" >>\nstream\n"+stream+"\nendstream"
  ];
  let out="%PDF-1.4\n";
  const offs=[];
  objs.forEach((o,i)=>{ offs.push(out.length); out+=(i+1)+" 0 obj\n"+o+"\nendobj\n"; });
  const xref=out.length;
  out+="xref\n0 "+(objs.length+1)+"\n0000000000 65535 f \n";
  offs.forEach(o=>{ out+=String(o).padStart(10,"0")+" 00000 n \n"; });
  out+="trailer\n<< /Size "+(objs.length+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  return out;
}
function descargarPDF(){
  try{
    const s=S();
    const pdf=generarPDF(s);
    // octet-stream = el navegador lo DESCARGA (con application/pdf lo abre en el visor)
    const blob=new Blob([pdf],{type:"application/octet-stream"});
    const nombre="EVOBIKE-"+(s.codigo||"codigo")+".pdf";

    // 1) intento clasico
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=nombre; a.rel="noopener"; a.style.display="none";
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ try{ document.body.removeChild(a); }catch(e){} }, 1500);

    // 2) refuerzo por si el navegador lo ignora
    setTimeout(()=>{
      if(!document.hidden){
        try{
          const a2=document.createElement("a");
          a2.href=url; a2.download=nombre;
          a2.target="_self";
          document.body.appendChild(a2); a2.click();
          setTimeout(()=>{ try{ document.body.removeChild(a2); }catch(e){} }, 1200);
        }catch(e){}
      }
    }, 500);

    setTimeout(()=>URL.revokeObjectURL(url), 60000);
    sonidoMoneda();
    const b=document.getElementById("desc");
    if(b){ const t=b.textContent; b.textContent="DESCARGANDO…"; setTimeout(()=>b.textContent=t,2500); }
  }catch(e){
    alert("No se pudo generar el PDF. Sacale una captura a tu código.");
  }
}

function copiarCodigo(){
  const s=S();
  const txt = "EVOBIKE · Mi número para el sorteo de la SOL PRO es "+s.codigo+
              " ("+((s.nom||"")+" "+(s.ape||"")).trim()+")";
  const listo = ()=>{
    const b=document.getElementById("copiar");
    if(b){ b.textContent="¡COPIADO!"; setTimeout(()=>{ b.textContent="COPIAR MI NÚMERO"; }, 1800); }
    sonidoMoneda();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(listo).catch(()=>respaldo());
  } else respaldo();
  function respaldo(){
    const t=document.createElement("textarea");
    t.value=txt; document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); listo(); }catch(e){ alert(txt); }
    document.body.removeChild(t);
  }
}
